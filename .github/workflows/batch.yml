# Slesty batch runner - PUBLIC repo, zero content.
#
# SECURITY MODEL (non-negotiables):
#
#   1. NOTHING from the private repos is ever stored here: no queue
#      (it names artists), no downloads, no zips, no logs. Public-repo
#      artifacts and releases are downloadable by ANYONE with the URL.
#   2. The run log stays CONTENT-FREE: no artist names, no track
#      titles, no ASINs. The worker binary + driver enforce this.
#   3. Credentials ride in THIS repo's encrypted secrets:
#        SLESTY_RUNNER_TOKEN : fine-grained PAT - Contents:rw on
#                              slesty-worker + slesty-vault ONLY
#        SLESTY_CREDS        : slesty device credentials JSON
#   4. Output zips go straight to the PRIVATE slesty-vault release.
#
# Flow (all over HTTPS with the runner PAT - no deploy keys):
#   clone worker -> build worker -> fetch slesty binary from vault's
#   'slesty-bin' release -> plan (counts only) -> parallel download via
#   scripts/run.sh -> zip -> upload to slesty-vault release 'batch-N'.

name: batch

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Human-readable release name, e.g. 'Imagine Dragons - complete (81 tracks, UHD)'"
        required: true
      description:
        description: "Short description shown on the release (optional)"
        required: false
        default: ""
      parallel:
        description: "Download processes in flight (default 8)"
        required: false
        default: "8"
      max_minutes:
        description: "Hard stop for the whole run (default 180)"
        required: false
        default: "180"

permissions: {}

env:
  WORKER_REPO: ryyr-ry/slesty-worker
  VAULT_REPO: ryyr-ry/slesty-vault

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(github.event.inputs.max_minutes || '180') }}
    steps:
      - name: Clone the private worker (code + queue; PAT over HTTPS)
        env:
          RUNNER_TOKEN: ${{ secrets.SLESTY_RUNNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${RUNNER_TOKEN}@github.com/${WORKER_REPO}.git" \
            worker 2>/dev/null
          # NOTE: the clone URL above is redacted by GitHub in logs.
          echo "worker revision: $(cd worker && git rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler zip
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Build the worker
        run: cargo build --release
        working-directory: worker

      - name: Fetch the slesty binary (private vault release)
        env:
          GH_TOKEN: ${{ secrets.SLESTY_RUNNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download slesty-bin --repo "$VAULT_REPO" \
            --pattern 'slesty-linux-x64*' --output slesty --clobber \
            || { echo "slesty binary missing in vault (publish it once)"; exit 1; }
          chmod +x slesty

      - name: Stage credentials (secret -> runner-only dir)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slesty-creds/accounts"
          printf '%s' "$SLESTY_CREDS" > "$RUNNER_TEMP/slesty-creds/accounts/device.json"
          # slesty's SLESTY_CRED_DIR expects <dir>/{customer_id}.json per
          # its _index; simplest: also write an index pointing at the file.
          CUST=$(printf '%s' "$SLESTY_CREDS" | sed -n 's/.*"customer_id":"\([^"]*\)".*/\1/p')
          cp "$RUNNER_TEMP/slesty-creds/accounts/device.json" \
             "$RUNNER_TEMP/slesty-creds/${CUST}.json"
          printf '["%s"]' "$CUST" > "$RUNNER_TEMP/slesty-creds/_index.json"
          echo "SLESTY_CRED_DIR=$RUNNER_TEMP/slesty-creds" >> "$GITHUB_ENV"
        env:
          SLESTY_CREDS: ${{ secrets.SLESTY_CREDS }}

      - name: Plan (counts only in the log)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run"
          cp worker/jobs/queue/job.json "$RUNNER_TEMP/run/job.json"
          ./worker/target/release/slesty-worker \
            "$RUNNER_TEMP/run/job.json" "$RUNNER_TEMP/run/remaining.json"

      - name: Download + zip + upload (per-request logs stay in RUNNER_TEMP)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SLESTY_RUNNER_TOKEN }}
          SLESTY_QUALITY: UHD
          RELEASE_LABEL: ${{ github.event.inputs.label }}
          RELEASE_DESC: ${{ github.event.inputs.description }}
        run: |
          set -euo pipefail
          export RUNNER_TEMP
          bash worker/scripts/run.sh \
            "$RUNNER_TEMP/run/manifest.txt" \
            "$RUNNER_TEMP/music" \
            "$VAULT_REPO" \
            "batch-${{ github.run_number }}" \
            "${{ github.event.inputs.parallel || '8' }}"

      - name: Summary (counts only)
        if: always()
        shell: bash
        run: |
          {
            echo "## batch summary"
            echo "- run: ${{ github.run_number }}"
            if [ -d "$RUNNER_TEMP/music" ]; then
              echo "- files: $(find "$RUNNER_TEMP/music" -type f | wc -l)"
            fi
            if ls "$RUNNER_TEMP"/failed_* > /dev/null 2>&1; then
              echo "- failed requests: $(ls "$RUNNER_TEMP"/failed_* | wc -l)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
